<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ammie Beauty Empire — professional nail, lash, and beauty services in Ifite, Awka. Book your appointment today.">
    <meta name="theme-color" content="#111111">
    <meta property="og:title" content="Ammie Beauty Empire">
    <meta property="og:description" content="Your beauty, our priority. Professional nails, lashes, pedicure, and manicure services in Awka.">
    <meta property="og:type" content="website">
    <title>Ammie Beauty Empire | Nails, Lashes & Beauty in Awka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* GENERAL STYLES */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            color: white;
            background: #000;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            transition: background 0.3s ease;
        }

        nav.scrolled {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        nav .logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 20px;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        nav .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav .nav-links a:hover {
            color: #e8a0bf;
        }

        /* HERO SECTION */
        .hero {
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1604654894610-df63bc536371') no-repeat center/cover;
            position: relative;
        }

        .overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .overlay h1 {
            font-size: 52px;
            margin: 0 0 10px;
            letter-spacing: 1px;
        }

        .overlay p {
            font-size: 18px;
            color: rgba(255,255,255,0.85);
            margin: 0 0 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* BUTTON STYLE */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #9b59b6, #e8a0bf);
            padding: 14px 32px;
            text-decoration: none;
            color: white;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.6);
        }

        /* SECTION STYLE */
        .section {
            padding: 60px 20px;
            text-align: center;
            background: #111;
        }

        .section h2 {
            font-size: 32px;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .section h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: linear-gradient(135deg, #9b59b6, #e8a0bf);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        /* SERVICES GRID */
        .services-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            padding: 0 10px;
        }

        .service-tag {
            background: rgba(155, 89, 182, 0.15);
            border: 1px solid rgba(155, 89, 182, 0.3);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            color: #e8a0bf;
            transition: background 0.3s, transform 0.3s;
        }

        .service-tag:hover {
            background: rgba(155, 89, 182, 0.25);
            transform: translateY(-2px);
        }

        /* GALLERY */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            padding: 0 20px 40px;
            background: #111;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(155, 89, 182, 0.3);
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 200;
            animation: fadeIn 0.3s ease;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* LOCATION */
        .location-text {
            font-size: 17px;
            color: rgba(255,255,255,0.8);
            line-height: 1.6;
        }

        /* FOOTER */
        footer {
            background: #0a0a0a;
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        footer p {
            margin: 0;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        /* FADE IN ANIMATION */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SCROLL REVEAL */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            nav {
                padding: 12px 20px;
            }

            nav .nav-links {
                gap: 16px;
            }

            nav .nav-links a {
                font-size: 12px;
            }

            .hero {
                height: 80vh;
            }

            .overlay h1 {
                font-size: 32px;
            }

            .overlay p {
                font-size: 14px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }

            .section {
                padding: 40px 15px;
            }

            .section h2 {
                font-size: 26px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 0 15px 30px;
            }

            .gallery img {
                height: 180px;
            }

            .service-tag {
                font-size: 13px;
                padding: 8px 16px;
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- NAVIGATION -->
<nav aria-label="Main navigation">
    <a href="#" class="logo">Ammie Beauty</a>
    <ul class="nav-links">
        <li><a href="#services">Services</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#location">Location</a></li>
    </ul>
</nav>

<!-- HERO -->
<header class="hero">
    <div class="overlay">
        <h1>Ammie Beauty Empire</h1>
        <p>Your beauty, our priority</p>
        <a class="btn" href="https://wa.me/2347040981913" aria-label="Book an appointment on WhatsApp">
            Book on WhatsApp
        </a>
    </div>
</header>

<!-- SERVICES -->
<section id="services" class="section reveal">
    <h2>Our Services</h2>
    <div class="services-list">
        <span class="service-tag">Acrylic Nails</span>
        <span class="service-tag">Gel Nails</span>
        <span class="service-tag">Acrylic Toes</span>
        <span class="service-tag">Lashes</span>
        <span class="service-tag">Pedicure</span>
        <span class="service-tag">Manicure</span>
        <span class="service-tag">Press-On Nails</span>
    </div>
</section>

<!-- GALLERY -->
<section id="gallery" class="section reveal">
    <h2>Our Work</h2>
</section>

<div class="gallery" role="list">
    <img src="images/nails1.jpeg" alt="Acrylic nail design by Ammie Beauty Empire" role="listitem" loading="lazy">
    <img src="images/nail2.jpeg" alt="Professional nail art by Ammie Beauty Empire" role="listitem" loading="lazy">
    <img src="images/nails3.jpeg" alt="Gel nail styling by Ammie Beauty Empire" role="listitem" loading="lazy">
    <img src="images/lashes.jpeg" alt="Lash extensions by Ammie Beauty Empire" role="listitem" loading="lazy">
</div>

<!-- LOCATION -->
<section id="location" class="section reveal">
    <h2>Find Us</h2>
    <p class="location-text">Divine Junction, Ifite, Awka</p>
    <a class="btn" href="https://wa.me/2347040981913" style="margin-top: 20px;" aria-label="Send a message on WhatsApp">
        Message Us
    </a>
</section>

<footer>
    <p>&copy; 2026 Ammie Beauty Empire</p>
</footer>

<!-- SCRIPTS -->
<script>
    // Lightbox for gallery images
    document.querySelectorAll(".gallery img").forEach(img => {
        img.onclick = function() {
            const popup = document.createElement("div");
            popup.className = "lightbox";
            popup.setAttribute("role", "dialog");
            popup.setAttribute("aria-label", "Image preview");
            popup.onclick = () => popup.remove();

            const bigImg = document.createElement("img");
            bigImg.src = this.src;
            bigImg.alt = this.alt;

            popup.appendChild(bigImg);
            document.body.appendChild(popup);
        };
    });

    // Close lightbox on Escape key
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
            const lightbox = document.querySelector(".lightbox");
            if (lightbox) lightbox.remove();
        }
    });

    // Navbar background on scroll
    const nav = document.querySelector("nav");
    window.addEventListener("scroll", () => {
        if (window.scrollY > 50) {
            nav.classList.add("scrolled");
        } else {
            nav.classList.remove("scrolled");
        }
    });

    // Scroll reveal animation
    const revealElements = document.querySelectorAll(".reveal");
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
            }
        });
    }, { threshold: 0.15 });

    revealElements.forEach(el => observer.observe(el));
</script>

</body>
</html>
